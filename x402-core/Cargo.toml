[package]
name = "x402-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_bencode = "0.2.4"
serde = { version = "1.0.136", features = ["derive"] }
serde_bytes = "0.11"
sha1 = "0.10.1"
sha2 = "0.10.8"
hex = "0.4.3"
svix-ksuid = "0.8.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
serde_json = "1"
