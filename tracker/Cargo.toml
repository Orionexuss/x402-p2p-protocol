[package]
name = "x402-tracker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tracker"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
bitvec = "1"
hex = "0.4"
ed25519-dalek = "2"
bs58 = "0.5.1"
